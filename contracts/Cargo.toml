[workspace]
resolver = "2"
members = [
  "notes",
  "shop-recycling",
  "airline",
  "museum",
  "smart-wallet",
  "spending-limit-policy",
  "ed25519-verifier",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Pinned to the soroban-sdk version used by OpenZeppelin stellar-accounts 0.7.2
soroban-sdk = { version = "26.1.0", features = ["experimental_spec_shaking_v2"] }
stellar-accounts = "0.7.2"
stellar-contract-utils = "0.7.2"
notes = { path = "notes" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
